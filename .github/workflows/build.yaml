name: Build and Publish Add-on

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  ADDON_SLUG: smart-panel

jobs:
  lint:
    name: Lint Add-on Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate config.yaml
        run: |
          pip install yamllint
          yamllint -d relaxed ${{ env.ADDON_SLUG }}/config.yaml
          yamllint -d relaxed repository.yaml

  build:
    name: Build (${{ matrix.arch }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - aarch64
          - armv7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' ${{ env.ADDON_SLUG }}/config.yaml | awk '{print $2}' | tr -d '"')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Determine Docker platform
        id: platform
        run: |
          case "${{ matrix.arch }}" in
            amd64)   echo "platform=linux/amd64" >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "platform=linux/arm64" >> "$GITHUB_OUTPUT" ;;
            armv7)   echo "platform=linux/arm/v7" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Extract build-from image
        id: build_from
        run: |
          BUILD_FROM=$(python3 -c "
          import yaml
          with open('${{ env.ADDON_SLUG }}/build.yaml') as f:
              data = yaml.safe_load(f)
          print(data['build_from']['${{ matrix.arch }}'])
          ")
          echo "image=${BUILD_FROM}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.ADDON_SLUG }}
          file: ${{ env.ADDON_SLUG }}/Dockerfile
          platforms: ${{ steps.platform.outputs.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.ADDON_SLUG }}-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ env.ADDON_SLUG }}-${{ matrix.arch }}:latest
          build-args: |
            BUILD_FROM=${{ steps.build_from.outputs.image }}
            SMART_PANEL_VERSION=latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
