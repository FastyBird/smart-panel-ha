name: Smart Panel
version: "0.7.0-alpha"
slug: smart-panel
description: >-
  A customizable display interface for visualizing and controlling smart homes
  from any touchscreen
url: https://github.com/fastybird/smart-panel-ha
image: "ghcr.io/fastybird/smart-panel-{arch}"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false

# Ingress configuration - embeds the panel in the HA sidebar
ingress: true
ingress_port: 0
ingress_stream: true
panel_icon: mdi:view-dashboard
panel_title: Smart Panel

# Home Assistant API access
homeassistant_api: true
hassio_api: true
auth_api: true

# Web UI direct access
webui: http://[HOST]:[PORT:3000]

# Ports
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Web interface

# Volume mappings
map:
  - config:rw
  - ssl:ro
  - share:rw

# User-configurable options
options:
  log_level: info
  token_secret: ""
  influxdb_host: ""
  influxdb_database: fastybird
  influxdb_username: ""
  influxdb_password: ""

schema:
  log_level: list(debug|info|warn|error)
  token_secret: str?
  influxdb_host: str?
  influxdb_database: str?
  influxdb_username: str?
  influxdb_password: str?
